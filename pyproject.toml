[project]
name = "adversarial-search-csp"
version = "0.1.0"
description = "Adversarial search (minimax/negamax + alpha-beta) and CSP backtracking solvers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pygame==2.6.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
# Expose the source packages to the test suite without sys.path hacks.
pythonpath = ["tictactoe", "csp"]
testpaths = ["tests"]
